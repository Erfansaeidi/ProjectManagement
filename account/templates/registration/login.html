{% extends "base.html" %}
{% block title %}Log In{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Log In</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                        <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                               class="form-control" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                               class="form-control" required>
                    </div>

                    <button class="btn btn-primary w-100 mb-3" type="submit">Log In</button>
                </form>
                <div class="d-flex justify-content-between small">
                    <a href="{% url 'password_reset' %}">Forgot password?</a>
                    <a href="{% url 'signup' %}">Create account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
