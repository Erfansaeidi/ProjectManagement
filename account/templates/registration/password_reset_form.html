{% extends "base.html" %}
{% block title %}Forgot Your Password?{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0">Reset Password</h5></div>
            <div class="card-body">
                <p class="text-muted">Enter your email address to receive password reset instructions.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
                        <input type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}"
                               class="form-control" required>
                        {% for error in form.email.errors %}
                            <div class="invalid-feedback d-block">{{ error }}</div>
                        {% endfor %}
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Send Instructions</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
